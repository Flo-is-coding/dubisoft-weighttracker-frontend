<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet">

    <script src="js/script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.0/echarts.min.js"></script> <!-- Include ECharts -->
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>

    <title>Weight Tracker</title>

    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>

<body>
<flex id="column">
    <flex id="row_streak">
        <img id="streak_flame" src="assets/streak_flame_false.png">
        <h3 id="streak_text"></h3>
    </flex>
    <dotlottie-player id="lottie_title" src="https://lottie.host/dbac1d32-16f0-4141-aa8c-72f6eb2f1e4e/zKymMWzXiv.json"
                      background="transparent" speed="1" style="width: 200px; height: 200px;" loop
                      autoplay></dotlottie-player>
    <h1>Weighttracker</h1>
    <input id="weight" name="weight" placeholder="Was sagt die Waage?" type="number">
    <br>
    <flex id="row_checkboxes">
        <input id="creatin" name="creatin" type="checkbox">
        <input id="shit" name="shit" type="checkbox">
    </flex>
    <flex id="row_checkbox_text">
        <a>Kreatin?</a>
        <a>Geschissen?</a>
    </flex>
    <br>
    <button id="uploadButton" type="button" onclick="fetchPredictionsAndUploadInputsAndAdjustStreak()">Gewicht hochladen</button>

    <!-- Graph Section -->
    <div id="weightGraph" style="width: 100%; height: 400px;"></div>
</flex>

<script>
    // Fetch data from the API and render the graph using ECharts
    async function fetchAndRenderGraph() {
        const response = await fetch('https://dubisoftw-weightracker-backend.azurewebsites.net/api/v1/weightdata'); // Adjust this URL if needed
        const data = await response.json();

        // Prepare data for ECharts
        const dates = data.map(entry => new Date(entry.recordedAt).toLocaleDateString());
        const weights = data.map(entry => entry.weight);

        // Calculate min and max for y-axis
        const minWeight = Math.min(...weights);
        const maxWeight = Math.max(...weights);

        // Initialize ECharts instance
        const chartDom = document.getElementById('weightGraph');
        const myChart = echarts.init(chartDom);

        // ECharts configuration
        const option = {

            tooltip: {
                trigger: 'axis',
                formatter: '{b}: {c} kg'
            },
            xAxis: {
                type: 'category',
                data: dates,
                axisLabel: {
                    show: false // Hide x-axis labels
                },
                axisLine: {
                    show: false // Hide x-axis line
                },
                splitLine: {
                    show: false // Remove x-axis grid
                }
            },
            yAxis: {
                type: 'value',
                min: minWeight - 1, // Add slight padding below the min value
                max: maxWeight + 1, // Add slight padding above the max value
                axisLabel: {
                    show: false // Hide y-axis labels
                },
                splitLine: {
                    show: false // Remove background grid
                }
            },
            dataZoom: [
                {
                    type: 'inside', // Enable zooming inside the chart
                    start: 0,
                    end: 100
                },
                {
                    type: 'slider', // Enable zooming via slider
                    start: 0,
                    end: 100
                }
            ],
            series: [
                {
                    data: weights,
                    type: 'line',
                    smooth: true,
                    lineStyle: {
                        color: 'blue',
                        width: 3
                    },
                    symbolSize: 8
                }
            ]
        };

        // Render the chart
        myChart.setOption(option);

        // Make chart responsive
        window.addEventListener('resize', myChart.resize);
    }

    // Call the function to fetch and render the graph
    fetchAndRenderGraph();
</script>

</body>

</html>
