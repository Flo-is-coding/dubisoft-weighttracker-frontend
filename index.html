<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet">

    <script src="js/script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.0/echarts.min.js"></script> <!-- Include ECharts -->
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>

    <title>Weight Tracker</title>

    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>

<body>
<flex id="column">
    <flex id="row_streak">
        <img id="streak_flame" src="assets/streak_flame_false.png">
        <h3 id="streak_text"></h3>
    </flex>
    <dotlottie-player id="lottie_title" src="https://lottie.host/dbac1d32-16f0-4141-aa8c-72f6eb2f1e4e/zKymMWzXiv.json"
                      background="transparent" speed="1" style="width: 200px; height: 200px;" loop
                      autoplay></dotlottie-player>
    <h1>Weighttracker</h1>
    <input id="weight" name="weight" placeholder="Was sagt die Waage?" type="number">
    <br>
    <flex id="row_checkboxes">
        <input id="creatin" name="creatin" type="checkbox">
        <input id="shit" name="shit" type="checkbox">
    </flex>
    <flex id="row_checkbox_text">
        <a>Kreatin?</a>
        <a>Geschissen?</a>
    </flex>
    <flex>
        <label>
            Stunden:
            <input type="number" id="hours" name="hours" min="0" max="99" step="1">
        </label>
        <label>
            Minuten:
            <input type="number" id="minutes" name="minutes" min="0" max="59" step="1">
        </label>
    </flex>
    <br>
    <button id="uploadButton" type="button" onclick="fetchPredictionsAndUploadInputsAndAdjustStreak()">Daten hochladen</button>

    <!-- Graph Section -->
    <div id="weightGraph" style="width: 100%; height: 400px;"></div>
</flex>

<script>
    // Fetch data from the API and render the graph using ECharts


    // Call the function to fetch and render the graph
    fetchAndRenderGraph();
</script>

</body>

</html>
